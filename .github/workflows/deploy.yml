# On every push to main: build, typecheck, lint, test, then apply D1 migrations and deploy both
# Workers (the page and the chatbot's door). The checks always run. The deploy steps need one repository secret,
# CLOUDFLARE_API_TOKEN; until it is added the deploy is skipped with a notice (not an error) and
# the site is deployed by hand with `npm run deploy` (see CLAUDE.md). The Cloudflare account is
# named in each wrangler.jsonc (`account_id`), so no second secret is needed.
#
# This workflow never exports the database. Backups are made by the Worker itself and stay in
# Cloudflare. Do not add a step that writes database contents to the repository.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build frontend and typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: See whether this repository can deploy
        id: cloudflare
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Checks passed. Not deployed: add the CLOUDFLARE_API_TOKEN secret to this repository to deploy from GitHub."
          fi

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply health --remote -c workers/app/wrangler.jsonc

      - name: Deploy the page Worker
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy -c workers/app/wrangler.jsonc

      - name: Deploy the chatbot Worker
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy -c workers/mcp/wrangler.jsonc
